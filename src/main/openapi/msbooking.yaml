openapi: 3.0.3
info:
  title: RideHub Booking Service API
  version: 0.1.0
  description: API contract cho ms_booking - Quản lý đặt vé, thanh toán, hóa đơn và chỗ ngồi.
servers:
  - url: http://localhost:8083/api
    description: Local Dev Server
  - url: https://apigateway.phungvip.io.vn/services/msbooking/api
    description: Gateway Proxy

paths:
  /bookings:
    post:
      summary: Tạo mới booking
      operationId: createBooking
      tags:
        - booking-resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDTO'
      responses:
        '201':
          description: Booking được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDTO'
        '400':
          description: Dữ liệu không hợp lệ
    get:
      summary: Lấy danh sách booking (phân trang)
      operationId: getAllBookings
      tags:
        - booking-resource
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingDTO'

  /bookings/{id}:
    get:
      summary: Lấy chi tiết booking theo ID
      operationId: getBooking
      tags:
        - booking-resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Chi tiết booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDTO'
        '404':
          description: Không tìm thấy booking

  /tickets:
    get:
      summary: Lấy danh sách vé
      operationId: getAllTickets
      tags:
        - ticket-resource
      responses:
        '200':
          description: Danh sách vé
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketDTO'

  /tickets/{id}/cancel:
    post:
      summary: Hủy vé
      operationId: cancelTicket
      tags:
        - ticket-resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Hủy vé thành công

components:
  schemas:
    BookingDTO:
      type: object
      required:
        - bookingCode
        - status
        - totalAmount
        - bookedAt
        - customerId
        - tripId
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        bookingCode:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED, EXPIRED, REFUNDED]
        quantity:
          type: integer
        totalAmount:
          type: number
        bookedAt:
          type: string
          format: date-time
        customerId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          maxLength: 80
        tripId:
          type: integer
          format: int64
        lockGroupId:
          type: string
          maxLength: 36
        expiresAt:
          type: string
          format: date-time
        timeoutMinutes:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isDeleted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
          format: uuid

    TicketDTO:
      type: object
      required:
        - ticketCode
        - seatNumber
        - price
        - status
      properties:
        id:
          type: integer
          format: int64
        ticketCode:
          type: string
        seatNumber:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [BOOKED, CANCELLED, REFUNDED, USED]
        bookingId:
          type: integer
          format: int64

